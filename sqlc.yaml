version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/ledger.sql
    gen:
      go:
        package: store
        out: internal/ledger/store
        sql_package: pgx/v5
        overrides: &overrides
          - { db_type: uuid, go_type: string }
          - { db_type: uuid, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: text, nullable: true, go_type: { type: string, pointer: true } }
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/wallet.sql
    gen:
      go:
        package: store
        out: internal/wallet/store
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/idempotency.sql
    gen:
      go:
        package: store
        out: internal/platform/idempotency/store
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/audit.sql
    gen:
      go:
        package: store
        out: internal/audit/store
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity.sql
    gen:
      go:
        package: store
        out: internal/identity/store
        sql_package: pgx/v5
        overrides:
          - { db_type: uuid, go_type: string }
          - { db_type: uuid, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: text, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: timestamptz, go_type: time.Time }
          - { db_type: timestamptz, nullable: true, go_type: { type: time.Time, pointer: true } }
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/kyc.sql
    gen:
      go:
        package: store
        out: internal/kyc/store
        sql_package: pgx/v5
        overrides:
          - { db_type: uuid, go_type: string }
          - { db_type: uuid, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: text, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: timestamptz, go_type: time.Time }
          - { db_type: timestamptz, nullable: true, go_type: { type: time.Time, pointer: true } }
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/rg.sql
    gen:
      go:
        package: store
        out: internal/rg/store
        sql_package: pgx/v5
        overrides:
          - { db_type: uuid, go_type: string }
          - { db_type: text, nullable: true, go_type: { type: string, pointer: true } }
          - { db_type: timestamptz, go_type: time.Time }
          - { db_type: timestamptz, nullable: true, go_type: { type: time.Time, pointer: true } }
