# Render Blueprint for the free tier: one web service (API + in-process job workers), free Postgres, free Key Value.
# Secrets marked `sync: false` are entered once in the dashboard and are never stored in this repository.
databases:
  - name: lottery-db
    plan: free
    databaseName: lottery
    user: lottery

services:
  - type: keyvalue
    name: lottery-cache
    plan: free
    maxmemoryPolicy: noeviction # rate-limit counters must not be silently evicted
    ipAllowList: [] # reachable only from services in this workspace

  - type: web
    name: lottery-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TARGET
        value: cmd/api
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: VALKEY_ADDR
        fromService:
          type: keyvalue
          name: lottery-cache
          property: connectionString

      # Free plan: no pre-deploy command and no background worker, so the api migrates on start (under an advisory
      # lock) and runs the job workers in-process.
      - key: MIGRATE_ON_START
        value: "true"
      - key: WORKERS_IN_PROCESS
        value: "true"

      # Client address behind Render's load balancer. Render does not document a True-Client-IP header, so the rightmost
      # X-Forwarded-For entry (the one Render's own proxy appends) is used. It cannot be spoofed by a client; at worst
      # it is a proxy address and per-IP limits become coarse. See docs/runbooks/trusted-proxy.md before raising HOPS.
      - key: TRUSTED_PROXY_HEADER
        value: X-Forwarded-For
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # Random 256-bit values generated by Render on first deploy and kept across deploys.
      - key: OTP_KEY
        generateValue: true
      - key: TOKEN_SEED
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: IDENTITY_KEY
        generateValue: true

      # Vendor gateways and sign-in client ids: set in the dashboard. Unset means the feature fails closed
      # (no SMS, no registry checks, no SSO) rather than pretending to work.
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: KYC_API_URL
        sync: false
      - key: KYC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
