# Render Blueprint for the free tier: one web service (API + in-process job workers), free Postgres, free Key Value.
# Secrets marked `sync: false` are entered once in the dashboard and are never stored in this repository.
databases:
  - name: lottery-db
    plan: free
    databaseName: lottery
    user: lottery

services:
  - type: keyvalue
    name: lottery-cache
    plan: free
    maxmemoryPolicy: noeviction # rate-limit counters must not be silently evicted
    ipAllowList: [] # reachable only from services in this workspace

  - type: web
    name: lottery-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TARGET
        value: cmd/api
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: VALKEY_ADDR
        fromService:
          type: keyvalue
          name: lottery-cache
          property: connectionString

      # Free plan: no pre-deploy command and no background worker, so the api migrates on start (under an advisory
      # lock) and runs the job workers in-process.
      - key: MIGRATE_ON_START
        value: "true"
      - key: WORKERS_IN_PROCESS
        value: "true"

      # Client address. Measured on 2026-10-22 (docs/runbooks/trusted-proxy.md): Render sits behind Cloudflare, which sets
      # CF-Connecting-IP to the real client and refuses (403) requests that try to supply it. X-Forwarded-For is
      # "client, cloudflare edge, render balancer" and its rightmost entry rotates, so it is not used.
      - key: TRUSTED_PROXY_HEADER
        value: CF-Connecting-IP

      # Random 256-bit values generated by Render on first deploy and kept across deploys.
      - key: AUTH_KEY
        generateValue: true
      - key: TOKEN_SEED
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: IDENTITY_KEY
        generateValue: true

      # National-registry gateway and sign-in client ids: set in the dashboard once chosen. Unset means the feature
      # fails closed (no registry checks, no SSO) rather than pretending to work. There is no SMS gateway: phone
      # ownership is proved by the first M-Pesa top-up.
      - key: KYC_API_URL
        sync: false
      - key: KYC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false

      # M-Pesa (Daraja). Sandbox only until the owner decides otherwise: the production host is refused unless
      # DARAJA_ALLOW_PRODUCTION=true. Credentials are entered in the dashboard; all four unset means top-ups are
      # refused. The callback URL is RENDER_EXTERNAL_URL + /hooks/mpesa/stk/ + sha256(DARAJA_CALLBACK_TOKEN).
      - key: DARAJA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: DARAJA_CALLBACK_TOKEN
        generateValue: true
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
