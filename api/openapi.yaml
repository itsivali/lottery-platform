openapi: 3.1.0
info:
  title: Lottery Platform API
  version: 0.0.1
  description: |
    Public API contract (source of truth). Errors are RFC 7807 problem+json. Every POST, PUT, PATCH and DELETE requires an
    `Idempotency-Key` header; replays return the stored response with `Idempotent-Replay: true`, and reusing a key with a
    different request returns 422.
servers:
  - url: http://localhost:8080
tags:
  - name: ops
  - name: auth
  - name: kyc
  - name: responsible-gaming
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      operationId: readyz
      tags: [ops]
      summary: Readiness probe (checks Postgres)
      security: []
      responses:
        "200":
          description: Ready
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Dependency unavailable
          content:
            text/plain:
              schema: { type: string }
  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account with a phone number and password
      description: |
        There is no SMS code. The number is only a claim until the player proves they control it with the M-Pesa
        confirmation of their first top-up, so several people may claim one number; a number that already has a proved
        owner cannot be claimed (409). Passwords need 8 to 128 characters and must not be common or contain the number.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with phone number and password
      description: Every failure to authenticate is the same 401, so responses do not reveal which numbers have accounts.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password
      description: Ends every other session of the account.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotate a refresh token
      description: Presenting an already-used refresh token revokes the whole session.
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Refresh" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/sso/{provider}:
    post:
      operationId: signInSso
      tags: [auth]
      summary: Sign in with a linked Google or Apple identity
      description: An unlinked identity gets 409; it must sign in by phone, pass KYC and then link.
      security: []
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSignIn" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/auth/sso/{provider}/link:
    post:
      operationId: linkSso
      tags: [auth]
      summary: Link a Google or Apple identity to the verified account
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/Provider" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoLink" }
      responses:
        "204": { description: Linked }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/kyc:
    get:
      operationId: getKyc
      tags: [kyc]
      summary: Verification status of the signed-in player
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit national ID details for verification
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycSubmission" }
      responses:
        "202":
          description: |
            Accepted; verification runs in the background and the status is `pending`. Poll `GET /v1/kyc` for
            `verified`, `manual_review` or `rejected`. A registry outage only delays the result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/rg/limits:
    get:
      operationId: getLimits
      tags: [responsible-gaming]
      summary: Deposit limits in force and pending increases
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setLimit
      tags: [responsible-gaming]
      summary: Set a deposit limit (decreases apply now, increases after the cooling-off)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetLimit" }
      responses:
        "200":
          description: The new limit version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/rg/timeout:
    post:
      operationId: startTimeout
      tags: [responsible-gaming]
      summary: Take a time-out (24h, 7d or 30d)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Timeout" }
      responses:
        "204": { description: Time-out started }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/rg/self-exclusion:
    post:
      operationId: selfExclude
      tags: [responsible-gaming]
      summary: Self-exclude for 6 months, 1 year or permanently (cannot be shortened)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfExclusion" }
      responses:
        "204": { description: Self-exclusion started }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 URL-safe characters, unique per logical request.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[A-Za-z0-9._:~=+/-]+$" }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, apple] }
  responses:
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Device:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        fingerprint: { type: string, description: Required on android and ios. }
        platform: { type: string, enum: [android, ios, web] }
        attestation_token:
          type: string
          description: Play Integrity or App Attest token. It is evidence for the server-side verifier, never a verdict.
    Credentials:
      type: object
      additionalProperties: false
      required: [msisdn, password, device]
      properties:
        msisdn: { type: string, example: "0712345678" }
        password: { type: string, minLength: 8, maxLength: 128 }
        device: { $ref: "#/components/schemas/Device" }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 128 }
    Refresh:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        device_fingerprint: { type: string }
    SsoSignIn:
      type: object
      additionalProperties: false
      required: [id_token, nonce]
      properties:
        id_token: { type: string }
        nonce: { type: string }
        device: { $ref: "#/components/schemas/Device" }
    SsoLink:
      type: object
      additionalProperties: false
      required: [id_token, nonce]
      properties:
        id_token: { type: string }
        nonce: { type: string }
    Tokens:
      type: object
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: string, format: date-time }
    KycSubmission:
      type: object
      additionalProperties: false
      required: [national_id, full_name, date_of_birth]
      properties:
        national_id: { type: string, pattern: "^[0-9]{7,9}$" }
        full_name: { type: string, minLength: 2, maxLength: 100 }
        date_of_birth: { type: string, format: date }
    KycStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [none, pending, verified, manual_review, rejected] }
    Limit:
      type: object
      required: [amount_kes, effective_from]
      properties:
        amount_kes: { type: integer, format: int64, minimum: 1 }
        effective_from: { type: string, format: date-time }
    Limits:
      type: object
      required: [limits]
      properties:
        limits:
          type: object
          additionalProperties:
            type: object
            properties:
              current: { oneOf: [{ $ref: "#/components/schemas/Limit" }, { type: "null" }] }
              pending: { oneOf: [{ $ref: "#/components/schemas/Limit" }, { type: "null" }] }
    SetLimit:
      type: object
      additionalProperties: false
      required: [period, amount_kes]
      properties:
        period: { type: string, enum: [daily, weekly, monthly] }
        amount_kes: { type: integer, format: int64, minimum: 1 }
    Timeout:
      type: object
      additionalProperties: false
      required: [duration]
      properties:
        duration: { type: string, enum: ["24h", "7d", "30d"] }
    SelfExclusion:
      type: object
      additionalProperties: false
      required: [term]
      properties:
        term: { type: string, enum: ["6m", "1y", permanent] }
security:
  - bearer: []
