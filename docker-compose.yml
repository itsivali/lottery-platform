# Local development stack. All credentials here are throwaway local values.
name: lottery
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lottery, POSTGRES_PASSWORD: lottery, POSTGRES_DB: lottery }
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery"]
      interval: 3s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["${VALKEY_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin, KC_HEALTH_ENABLED: "true" }
    ports: ["8081:8080"]
  daraja-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/daraja } }
    ports: ["8090:8080"]
  kyc-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/stub } }
    environment: { MOCK_NAME: kyc-mock }
    ports: ["8091:8080"]
  sms-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/stub } }
    environment: { MOCK_NAME: sms-mock }
    ports: ["8092:8080"]
  drand-mock:
    build: { context: ., target: mock, args: { TARGET: mocks/stub } }
    environment: { MOCK_NAME: drand-mock }
    ports: ["8093:8080"]
  migrate:
    build: { context: ., target: lotteryctl, args: { TARGET: cmd/lotteryctl } }
    command: ["migrate", "up"]
    environment: { DATABASE_URL: "postgres://lottery:lottery@postgres:5432/lottery?sslmode=disable" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., target: api, args: { TARGET: cmd/api } }
    environment: { DATABASE_URL: "postgres://lottery:lottery@postgres:5432/lottery?sslmode=disable" }
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
