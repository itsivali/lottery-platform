name: deploy-prod
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production   # required reviewer: @itsivali; tags only
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Verify signed images exist for this tag
        run: |
          v="${VERSION#v}"
          for n in api worker lotteryctl; do
            cosign verify "ghcr.io/itsivali/lottery-platform/$n:$v" \
              --certificate-identity-regexp '^https://github.com/itsivali/lottery-platform/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done
      - name: Point Render services at the signed image
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_IDS: ${{ secrets.RENDER_API_SERVICE_IDS }}
        run: |
          v="${VERSION#v}"
          for svc in $(echo "$RENDER_API_SERVICE_IDS" | jq -r 'to_entries[] | "\(.key)=\(.value)"'); do
            name=${svc%%=*}; id=${svc#*=}
            case "$name" in api|worker*) img=$name; [[ $name == worker* ]] && img=worker;; *) continue;; esac
            curl -fsS -X PATCH "https://api.render.com/v1/services/$id" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"image\":{\"imagePath\":\"ghcr.io/itsivali/lottery-platform/$img:$v\"}}"
            curl -fsS -X POST "https://api.render.com/v1/services/$id/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' -d '{}'
          done
      - name: Summary and rollback
        run: |
          {
            echo "### Deployed $VERSION"
            echo "Render runs \`goose up\` as the pre-deploy command and waits for /readyz."
            echo "Rollback: re-run this workflow for the previous tag (or redeploy the previous tag in Render)."
          } >> "$GITHUB_STEP_SUMMARY"
