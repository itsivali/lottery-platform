name: nightly
on:
  schedule:
    - cron: "0 23 * * *"   # 02:00 EAT (UTC+3)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  nightly:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version-file: go.mod }
      - name: Mutation testing (gremlins) on money-path packages
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          for p in wallet ledger tickets game draws payments payouts; do
            if ls internal/$p/*.go 2>/dev/null | grep -qv doc.go; then
              (cd internal/$p && gremlins unleash --threshold-efficacy 75)
            fi
          done
      - name: Long property tests
        run: go test -tags integration -race -count=1 -run 'Property|Rapid' -rapid.checks=10000 ./...
      - name: 10-million-spin distribution test
        run: go test -tags integration -count=1 -run 'Distribution10M' ./...
      - name: RTP simulation report
        run: echo "lotteryctl simulate arrives in Phase 3"
      - name: Dependency audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Nightly failed ' + new Date().toISOString().slice(0, 10),
              body: 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId });
