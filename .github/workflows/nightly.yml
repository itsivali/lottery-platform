name: nightly
on:
  schedule:
    - cron: "0 23 * * *"   # 02:00 EAT (UTC+3)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  nightly:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Mutation testing (gremlins) on money-path packages
        # wallet and game are tested only against Postgres, so they are mutated with their integration tests (without
        # them every mutant is "not covered" and the score is a meaningless 0%)
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          for p in wallet ledger tickets game draws payments payouts; do
            if ls internal/$p/*.go 2>/dev/null | grep -qv doc.go; then
              tags=""
              case $p in wallet | game) tags="--tags integration --workers 2 --timeout-coefficient 5" ;; esac
              (cd internal/$p && gremlins unleash --threshold-efficacy 75 $tags)
            fi
          done
      - name: Long property tests
        # -rapid.checks is a flag of the test binaries, and go test stops reading its own flags at the first one it
        # does not know (it then tested "." and failed). So the packages come first and only those using rapid run.
        run: |
          pkgs=$(grep -rl '"pgregory.net/rapid"' --include='*_test.go' internal cmd | xargs -n1 dirname | sort -u | sed 's|^|./|')
          echo "property packages: $pkgs"
          # shellcheck disable=SC2086
          go test -tags integration -race -count=1 -timeout 60m -run 'Property|Rapid' $pkgs -rapid.checks=2000
      - name: 10-million-spin distribution test
        run: go test -tags integration,distribution -count=1 -timeout 30m -run 'Distribution10M' ./...
      - name: RTP simulation report
        # odds of a lucky day and the cost of a draw chance under the odds version in force, from real fair spins
        run: go run ./cmd/lotteryctl game simulate -days 1000000 | tee "$RUNNER_TEMP/simulation.json"
      - name: Dependency audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Nightly failed ' + new Date().toISOString().slice(0, 10),
              body: 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId });
