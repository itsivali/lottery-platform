name: preview-e2e
on:
  deployment_status:
permissions:
  contents: read
  pull-requests: write
  deployments: read
concurrency:
  group: preview-e2e-${{ github.event.deployment.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    # Only successful Render preview deployments; never runs for forks (no secrets).
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '' && github.event.repository.fork == false
    runs-on: ubuntu-24.04
    environment: preview
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      DARAJA_SANDBOX_CONSUMER_KEY: ${{ secrets.DARAJA_SANDBOX_CONSUMER_KEY }}
      DARAJA_SANDBOX_CONSUMER_SECRET: ${{ secrets.DARAJA_SANDBOX_CONSUMER_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Wait for preview to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$PREVIEW_URL/readyz" >/dev/null; then echo healthy; exit 0; fi
            sleep 5
          done
          echo "preview never became healthy" >&2; exit 1
      - name: Journey against preview
        id: journey
        run: |
          # Phase 0: probe only. The full signup-to-payout journey is added with the clients (Phase 7).
          curl -fsS "$PREVIEW_URL/healthz"
      - name: Comment on PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          OUTCOME: ${{ steps.journey.outcome }}
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.payload.deployment.sha });
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
                body: 'Preview E2E: ' + process.env.OUTCOME + ' (' + process.env.PREVIEW_URL + ')' });
            }
